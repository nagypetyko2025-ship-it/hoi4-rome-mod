l_english:
 ante_levy:0 "Levies"
 ante_levy_desc:0 "Farmers and herdsmen called to arms: many, cheap and brittle."
 ante_spearmen:0 "Spearmen"
 ante_spearmen_desc:0 "The warrior band of the free men, shield to shield."
 ante_hoplites:0 "Hoplites"
 ante_hoplites_desc:0 "Heavy infantry in the close order of the phalanx: unbreakable in front, slow and clumsy in rough country."
 ante_skirmishers:0 "Skirmishers"
 ante_skirmishers_desc:0 "Slingers and javelin men who wear down the enemy before the lines meet."
 ante_archers:0 "Archers"
 ante_archers_desc:0 "Massed bowmen - the strength of Persia, Kush and the steppe."
 ante_cavalry:0 "Cavalry"
 ante_cavalry_desc:0 "Noble horsemen with spear and javelin."
 ante_horse_archers:0 "Horse Archers"
 ante_horse_archers_desc:0 "The steppe's own way of war: shoot, wheel away, shoot again."
 ante_chariots:0 "Chariots"
 ante_chariots_desc:0 "Swift two-horse chariots - of the Britons and the Garamantes, and of kings of old."
 ante_war_elephants:0 "War Elephants"
 ante_war_elephants_desc:0 "Living siege towers. They break any line - sometimes their own."
 ante_siege_engines:0 "Siege Train"
