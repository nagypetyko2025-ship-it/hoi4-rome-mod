l_english:
 ante_council_of_elders:0 "Council of the Elders"
 ante_council_of_elders_desc:0 "The heads of the great families meet to decide the course of our people."
 ante_codify_customs:0 "Codify the Customs"
 ante_codify_customs_desc:0 "Write down - or recite before all - the laws of our fathers."
 ante_honour_the_gods:0 "Honour the Gods"
 ante_honour_the_gods_desc:0 "Raise altars and keep the festivals, so that the gods stand with us."
 ante_tribute:0 "Collect the Tribute"
 ante_tribute_desc:0 "Dues in grain, cattle and silver flow to the hall of the rulers."
 ante_envoys:0 "Envoys and Guest-Friends"
 ante_envoys_desc:0 "Gifts and oaths bind the great houses of our neighbours to ours."
 ante_oracles:0 "Consult the Oracles"
 ante_oracles_desc:0 "Seers, priests and wise men read the will of the gods - and much else."
 ante_scribes:0 "Scribes and Teachers"
 ante_scribes_desc:0 "Letters borrowed from the traders of the sea record our accounts and our deeds."
 ante_festivals:0 "Games and Festivals"
 ante_festivals_desc:0 "Contests of strength and song draw every clan to the sanctuary."
 ante_one_people:0 "One People"
 ante_one_people_desc:0 "Many clans, one assembly, one name."
 ante_tame_the_land:0 "Tame the Land"
 ante_tame_the_land_desc:0 "Drain the marshes, clear the scrub and mark the fields."
 ante_markets:0 "Markets and Trade"
 ante_markets_desc:0 "A market place under the protection of the gods brings traders from afar."
 ante_clear_forests:0 "Clear the Forests"
 ante_clear_forests_desc:0 "Axe and fire open new land for the plough."
 ante_craftsmen:0 "Craftsmen's Quarter"
 ante_craftsmen_desc:0 "Potters, weavers and carpenters settle by the walls."
 ante_mines:0 "Mines of the Hills"
 ante_mines_desc:0 "Copper, tin and the new iron are dug from the hills."
 ante_roads:0 "Paths and Fords"
 ante_roads_desc:0 "Tracks between the settlements, fords and ferries over the rivers."
 ante_smithies:0 "Smithies"
 ante_smithies_desc:0 "The smiths' fires burn day and night: spearheads, helmets, shields."
 ante_great_works:0 "Great Works"
 ante_great_works_desc:0 "Walls, temples and harbours that will outlast their builders."
 ante_city_of_stone:0 "A City of Stone"
 ante_city_of_stone_desc:0 "Our capital grows into a true city."
 ante_warrior_levy:0 "Levy of the Warriors"
 ante_warrior_levy_desc:0 "Every free man owes his spear when the horn sounds."
 ante_drill:0 "Drill the Spearmen"
 ante_drill_desc:0 "Shoulder to shoulder: the close order of the phalanx."
 ante_bronze_and_iron:0 "Bronze and Iron"
 ante_bronze_and_iron_desc:0 "Better blades and armour from the smiths."
 ante_horsemen:0 "Mounted Nobles"
 ante_horsemen_desc:0 "The sons of the great houses ride to war."
 ante_hillforts:0 "Hillforts"
 ante_hillforts_desc:0 "Earth ramparts and timber walls on every height."
 ante_seafarers:0 "Seafarers"
 ante_seafarers_desc:0 "Ships for fishing, trade - and raids along the coast."
 ante_war_bands:0 "Sworn War Bands"
 ante_war_bands_desc:0 "Companions who live and die with their lord."
 ante_ambition:0 "Ambition of Conquest"
 ante_ambition_desc:0 "Our neighbours' fields are rich and their walls are low."
 ante_host_of_the_people:0 "Host of the People"
 ante_host_of_the_people_desc:0 "The whole people under arms: a power to be feared."
 ante_rise_to_greatness:0 "Rise to Greatness"
 ante_rise_to_greatness_desc:0 "Lawgivers, builders and warriors have made us great. The world will know our name."
 ROM_regifugium:0 "Regifugium"
 ROM_regifugium_desc:0 "Tarquinius Superbus and his house are driven from the city. Rome will never again have a king - but patricians and plebeians now fight over the Republic."
 ROM_consuls_and_senate:0 "Consuls and Senate"
 ROM_consuls_and_senate_desc:0 "Two magistrates for one year, the fathers of the Senate to advise them."
 ROM_secession_of_the_plebs:0 "Secession of the Plebs"
 ROM_secession_of_the_plebs_desc:0 "494 BC: the plebeians march out to the Sacred Mount. Without them there is no army. Rome must choose: give way, or rule them."
 ROM_tribunes_of_the_plebs:0 "Tribunes of the Plebs"
 ROM_tribunes_of_the_plebs_desc:0 "Give way: sacrosanct protectors of the common people, with the power to say: veto."
 ROM_rule_of_the_fathers:0 "Rule of the Fathers"
 ROM_rule_of_the_fathers_desc:0 "Rule them: the patricians close ranks; Appius Claudius and the Senate yield nothing."
 ROM_twelve_tables:0 "The Twelve Tables"
 ROM_twelve_tables_desc:0 "451 BC: the Decemvirs write the law on bronze tablets in the Forum, for every citizen to read."
 ROM_lex_canuleia:0 "Lex Canuleia"
 ROM_lex_canuleia_desc:0 "445 BC: patricians and plebeians may marry. One people, slowly."
 ROM_censors:0 "The Censors"
 ROM_censors_desc:0 "Two censors count the citizens, judge their morals and let the public contracts."
 ROM_licinian_sextian_laws:0 "Licinian-Sextian Laws"
 ROM_licinian_sextian_laws_desc:0 "367 BC: one of the two consuls may be a plebeian. The great offices open to new men - and a new nobility is born."
 ROM_lex_hortensia:0 "Lex Hortensia"
 ROM_lex_hortensia_desc:0 "287 BC: the votes of the plebs bind the whole people. The struggle of the orders ends in concord."
 ROM_the_nobilitas:0 "The Nobilitas"
 ROM_the_nobilitas_desc:0 "The great families, old and new, share the consulships among themselves. The Senate rules Rome."
 ROM_capitoline_temple:0 "Temple of Jupiter on the Capitol"
 ROM_capitoline_temple_desc:0 "The great temple vowed by the kings is dedicated in the first year of the Republic."
 ROM_sibylline_books:0 "The Sibylline Books"
 ROM_sibylline_books_desc:0 "The prophetic books, kept by the priests, are consulted in every crisis."
 ROM_pontifex_maximus:0 "Pontifex Maximus"
 ROM_pontifex_maximus_desc:0 "The highest priest keeps the calendar, the records and the peace with the gods."
 ROM_vestal_virgins:0 "The Vestal Virgins"
 ROM_vestal_virgins_desc:0 "As long as the fire of Vesta burns, Rome stands."
 ROM_ludi_romani:0 "Ludi Romani"
 ROM_ludi_romani_desc:0 "Races and contests in the valley of the Circus, in honour of Jupiter Best and Greatest."
 ROM_evocatio:0 "Evocatio"
 ROM_evocatio_desc:0 "Before Veii falls, Camillus calls on Juno of Veii to leave the city and come to Rome. She comes."
 ROM_greek_gods:0 "Apollo and Asclepius"
 ROM_greek_gods_desc:0 "Open the city to the gods of the Greeks: the healer of Epidaurus comes to the Tiber island."
 ROM_mos_maiorum:0 "Mos Maiorum"
 ROM_mos_maiorum_desc:0 "The ways of the ancestors are enough. Foreign rites have no place in Rome."
 ROM_servian_centuries:0 "Classes and Centuries"
 ROM_servian_centuries_desc:0 "Every citizen serves according to his property: the hoplite phalanx of Rome."
 ROM_stipendium:0 "Stipendium"
 ROM_stipendium_desc:0 "For the long siege of Veii the soldiers are paid for the first time. The army can stay in the field all winter."
 ROM_camillus_reforms:0 "Reforms of Camillus"
 ROM_camillus_reforms_desc:0 "Long shields, iron-rimmed helmets, the heavy javelin. Now: break up the phalanx, or perfect it?"
 ROM_manipular_legion:0 "The Manipular Legion"
 ROM_manipular_legion_desc:0 "Hastati, principes and triarii in three lines of maniples: an army that bends but does not break."
 ROM_citizen_phalanx:0 "The Citizen Phalanx"
 ROM_citizen_phalanx_desc:0 "The old way, made perfect: a wall of bronze that no charge can break - on level ground."
 ROM_via_appia:0 "Via Appia"
 ROM_via_appia_desc:0 "312 BC: Appius Claudius paves the road from Rome to Capua. The legions march on stone."
 ROM_aqua_appia:0 "Aqua Appia"
 ROM_aqua_appia_desc:0 "The first aqueduct brings fresh water to a growing city."
 ROM_coloniae:0 "Latin Colonies"
 ROM_coloniae_desc:0 "Settlers of Rome and Latium hold the conquered land: every colony a garrison, every colonist a soldier."
 ROM_horatius_at_the_bridge:0 "Horatius at the Bridge"
 ROM_horatius_at_the_bridge_desc:0 "Lars Porsenna marches on Rome; one man holds the Sublician bridge."
 ROM_lake_regillus:0 "Battle of Lake Regillus"
 ROM_lake_regillus_desc:0 "The Latins and the exiled Tarquins are beaten; the Dioscuri fought for Rome. What now with Latium?"
 ROM_foedus_cassianum:0 "Foedus Cassianum"
 ROM_foedus_cassianum_desc:0 "493 BC: peace and alliance with the Latins - one army against the hill peoples."
 ROM_latium_by_the_sword:0 "Latium by the Sword"
 ROM_latium_by_the_sword_desc:0 "No treaty: the Latin towns will be Rome's subjects, not its equals."
 ROM_aequi_and_volsci:0 "Against the Aequi and Volsci"
 ROM_aequi_and_volsci_desc:0 "Every summer the hill tribes raid Latium. Every summer Rome marches."
 ROM_coriolanus:0 "Coriolanus"
 ROM_coriolanus_desc:0 "The proud hero of Corioli, exiled, leads the Volsci against his own city - and turns back at his mother's word."
 ROM_siege_of_veii:0 "The Siege of Veii"
 ROM_siege_of_veii_desc:0 "Ten years before the walls of the rich Etruscan city across the Tiber."
 ROM_southern_etruria:0 "The Cities of Southern Etruria"
 ROM_southern_etruria_desc:0 "Caere, Tarquinii and Falerii: after Veii the road to Etruria lies open."
 ROM_battle_of_the_allia:0 "The Allia"
 ROM_battle_of_the_allia_desc:0 "390 BC: Brennus and the Senones rout the legions; Rome burns, only the Capitol holds. Brennus names his price."
 ROM_pay_the_gold:0 "Pay the Gold"
 ROM_pay_the_gold_desc:0 "A thousand pounds of gold, weighed on the Gauls' false scales. Vae victis - but the city is saved, and rebuilt in peace."
 ROM_not_with_gold:0 "Not with Gold, but with Iron"
 ROM_not_with_gold_desc:0 "Camillus arrives as the gold is weighed: Rome buys its freedom with iron. Never again."
 ROM_servian_wall:0 "The Servian Wall"
 ROM_servian_wall_desc:0 "378 BC: eleven kilometres of tufa blocks. No barbarian will take the city again."
 ROM_second_founder:0 "Camillus, the Second Founder"
 ROM_second_founder_desc:0 "The city is rebuilt; the Gauls are driven back. Rome rises again from its ashes."
 ROM_latin_war:0 "The Latin War"
 ROM_latin_war_desc:0 "340-338 BC: the Latins demand equal rights - and lose everything. Rome dissolves the League."
 ROM_samnite_wars:0 "The Samnite Wars"
 ROM_samnite_wars_desc:0 "Three wars for central Italy: the yoke of the Caudine Forks, and victory at last."
 ROM_sentinum:0 "Sentinum"
 ROM_sentinum_desc:0 "295 BC: Samnites, Gauls, Etruscans and Umbrians against Rome - the Battle of the Nations of Italy."
 ROM_tarentum_and_pyrrhus:0 "Tarentum and Pyrrhus"
 ROM_tarentum_and_pyrrhus_desc:0 "Tarentum calls the King of Epirus and his elephants. Rome loses battles - and wins the war."
 ROM_treaty_with_tarentum:0 "Treaty with Tarentum"
 ROM_treaty_with_tarentum_desc:0 "The richest Greek city of Italy is worth more as a friend: its fleet, its coin, its harbour - under Rome."
 ROM_italia:0 "Italia"
 ROM_italia_desc:0 "From the Arno to the Strait, the peoples of Italy are Rome's allies - or Rome's. Where next: the sea, or the north?"
 ROM_towards_sicily:0 "Towards Sicily"
 ROM_towards_sicily_desc:0 "264 BC: the Mamertines of Messana call for help. Across the Strait waits Carthage."
 ROM_cisalpine_gaul:0 "Gallia Cisalpina"
 ROM_cisalpine_gaul_desc:0 "Avenge the Allia for ever: the plain of the Po, from the Senones to the Insubres, becomes Roman land."
 ROM_the_king_remains:0 "The King Remains"
 ROM_the_king_remains_desc:0 "The conspiracy of Brutus and Collatinus is betrayed. Tarquinius Superbus stays on the throne, and Rome stays a kingdom - a kingdom whose people hate their king."
 ROM_purge_the_conspirators:0 "Purge the Conspirators"
 ROM_purge_the_conspirators_desc:0 "The sons of Brutus, the Vitellii, the Aquilii: every house that plotted pays with blood or exile."
 ROM_tyranny_of_superbus:0 "Tyranny of Superbus"
 ROM_tyranny_of_superbus_desc:0 "The king rules without the Senate, judges without counsel and takes what he likes. Fear is enough."
 ROM_a_king_for_the_people:0 "A King for the People"
 ROM_a_king_for_the_people_desc:0 "Like Servius Tullius before him, the king takes the side of the poor against the great houses."
 ROM_the_celeres:0 "The Celeres"
 ROM_the_celeres_desc:0 "Three hundred horsemen, the king's own guard since Romulus."
 ROM_cloaca_maxima:0 "Cloaca Maxima"
 ROM_cloaca_maxima_desc:0 "The great sewer drains the Forum valley: the works of the Tarquins go on, built by the people's labour."
 ROM_books_of_the_sibyl:0 "The Books of the Sibyl"
 ROM_books_of_the_sibyl_desc:0 "An old woman offers the king nine books, then six, then three, for the same price. Tarquinius pays."
 ROM_etruscan_craftsmen:0 "Etruscan Craftsmen"
 ROM_etruscan_craftsmen_desc:0 "Builders, smiths and painters from Etruria work for the Etruscan king of Rome."
 ROM_head_of_the_latin_league:0 "Head of the Latin League"
 ROM_head_of_the_latin_league_desc:0 "The kings of Rome lead the festival on the Alban Mount: the Latins follow Rome - or else."
 ROM_stratagem_of_gabii:0 "The Stratagem of Gabii"
 ROM_stratagem_of_gabii_desc:0 "Sextus, the king's son, takes Gabii by treachery; Suessa Pometia of the Volsci falls to the king's army."
 ROM_king_of_the_etruscans:0 "Lucumo of Etruria"
 ROM_king_of_the_etruscans_desc:0 "The Tarquins are Etruscans: the twelve cities should have one king - and Porsenna of Clusium is in the way."
 ROM_royal_army:0 "The Royal Army"
 ROM_royal_army_desc:0 "The king's phalanx, his Celeres and the levies of Latium and Etruria under one command."
 ROM_royal_roads:0 "The King's Roads"
 ROM_royal_roads_desc:0 "Roads radiate from Rome to the subject towns, so that the king's army is everywhere in days."
 ROM_the_twelve_cities:0 "The Twelve Cities"
 ROM_the_twelve_cities_desc:0 "Veii, Caere, Tarquinii and the rest bow to the king of Rome."
 ROM_regnum_italiae:0 "Regnum Italiae"
 ROM_regnum_italiae_desc:0 "A kingdom, not a city: Latins, Etruscans and Italians under one crown."
 ROM_the_samnite_mountains:0 "The Samnite Mountains"
 ROM_the_samnite_mountains_desc:0 "The hill peoples of the south have never had a master."
 ROM_magna_graecia:0 "Magna Graecia"
 ROM_magna_graecia_desc:0 "Kyme, Taras, Kroton: the rich Greek cities of the south will pay tribute to the king."
 ROM_king_of_italy:0 "King of Italy"
 ROM_king_of_italy_desc:0 "From the Alps to the Strait one king, one army, one law. The Republic is a dream nobody remembers."
 ROM_royal_amnesty:0 "Amnesty for the Exiles"
 ROM_royal_amnesty_desc:0 "Families fled to Veii, Gabii and Cumae. The king's heralds promise: come home, and nothing will be done to you."
 ROM_grain_from_cumae:0 "Grain from Cumae"
 ROM_grain_from_cumae_desc:0 "Empty fields, empty granaries: the king buys grain from the Greeks so the city does not starve."
 ROM_call_back_the_settlers:0 "Call Back the Settlers"
 ROM_call_back_the_settlers_desc:0 "Land and tax freedom for every family that returns to Rome."
 ROM_crush_the_riots:0 "Crush the Riots"
 ROM_crush_the_riots_desc:0 "The Celeres clear the Forum. Order is restored - and remembered."
 ROM_hear_the_people:0 "Hear the People"
 ROM_hear_the_people_desc:0 "The king sits in judgement in the Forum himself and hears every complaint - at a price to his pride and his treasury."
 ROM_a_loyal_rome:0 "A Loyal Rome"
 ROM_a_loyal_rome_desc:0 "A generation grows up that knows no other ruler. The hatred fades into habit, and habit into loyalty."
 ROM_forum_boarium:0 "Forum Boarium"
 ROM_forum_boarium_desc:0 "The cattle market by the Tiber ford, where Latins, Etruscans and Greeks trade."
 ROM_via_salaria:0 "Via Salaria"
 ROM_via_salaria_desc:0 "The salt road: from the pans at the mouth of the Tiber up into the Sabine hills."
 ROM_salt_pans:0 "The Salt Pans"
 ROM_salt_pans_desc:0 "Whoever holds the salt of the Tiber mouth holds the trade of central Italy."
 ROM_tiber_harbour:0 "Harbour on the Tiber"
 ROM_tiber_harbour_desc:0 "Wharves below the Aventine and a port at the river mouth."
 ROM_aes_signatum:0 "Aes Signatum"
 ROM_aes_signatum_desc:0 "Bronze bars stamped by the state: the first money of Rome."
 ROM_ager_publicus:0 "Ager Publicus"
 ROM_ager_publicus_desc:0 "Conquered land belongs to the Roman people - to be settled, leased or grazed."
 ROM_smiths_of_rome:0 "Smiths of the Argiletum"
 ROM_smiths_of_rome_desc:0 "Helmets, spearheads and the iron-shod pilum by the thousand."
 ROM_juno_moneta:0 "The Mint of Juno Moneta"
 ROM_juno_moneta_desc:0 "Silver coins struck in the temple of Juno the Warner on the Capitol."
 ROM_great_public_works:0 "Great Public Works"
 ROM_great_public_works_desc:0 "Temples, basilicas, walls and roads: the censors spend the spoils of war on the city."
 ATH_reforms_of_cleisthenes:0 "Reforms of Cleisthenes"
 ATH_reforms_of_cleisthenes_desc:0 "508 BC: the tyrants are gone; Cleisthenes gives power to the people of Attica."
 ATH_ten_tribes:0 "The Ten Tribes"
 ATH_ten_tribes_desc:0 "Every deme of city, coast and inland mixed into ten new tribes: the old clans lose their grip."
 ATH_ostracism:0 "Ostracism"
 ATH_ostracism_desc:0 "Once a year the people may write a name on a potsherd - and send a man into exile for ten years."
 ATH_strategoi:0 "The Ten Strategoi"
 ATH_strategoi_desc:0 "Each tribe elects a general; the generals answer to the Assembly."
 ATH_age_of_pericles:0 "The Age of Pericles"
 ATH_age_of_pericles_desc:0 "The first citizen of a democracy at the height of its power."
 ATH_laurion_silver:0 "Silver of Laurion"
 ATH_laurion_silver_desc:0 "A new, rich vein is struck in the mines of Laurion."
 ATH_piraeus:0 "The Piraeus"
 ATH_piraeus_desc:0 "Three natural harbours are walled into the port of Athens."
 ATH_themistocles_fleet:0 "The Fleet of Themistocles"
 ATH_themistocles_fleet_desc:0 "The silver of Laurion is not shared out: it builds two hundred triremes."
 ATH_war_with_chalcis:0 "War with Chalcis"
 ATH_war_with_chalcis_desc:0 "506 BC: the Boeotians and Chalcidians invade Attica and are beaten on one day."
 ATH_cleruchies:0 "Cleruchies"
 ATH_cleruchies_desc:0 "Athenian citizens settle the conquered land and keep their citizenship."
 ATH_aid_the_ionians:0 "Aid the Ionians"
 ATH_aid_the_ionians_desc:0 "Twenty ships sail to help the Greeks of Asia against the Great King. The beginning of evils."
 ATH_marathon:0 "Marathon"
 ATH_marathon_desc:0 "490 BC: the hoplites of Athens run at the Persian line - and win."
 ATH_delian_league:0 "The Delian League"
 ATH_delian_league_desc:0 "The islands and the cities of the coast swear on sunken iron: a league against Persia, led by Athens."
 ATH_parthenon:0 "The Parthenon"
 ATH_parthenon_desc:0 "Marble from Pentelicus and gold of the League: a temple for the Maiden of Athens."
 ATH_long_walls:0 "The Long Walls"
 ATH_long_walls_desc:0 "City and harbour joined by walls: Athens becomes an island that no army can starve."
 ATH_school_of_hellas:0 "The School of Hellas"
 ATH_school_of_hellas_desc:0 "Philosophers, poets, historians and builders: all Greece learns from Athens."
 LAK_lycurgan_order:0 "The Lycurgan Order"
 LAK_lycurgan_order_desc:0 "The laws of Lycurgus: iron coins, common messes, and every citizen a soldier."
 LAK_agoge:0 "The Agoge"
 LAK_agoge_desc:0 "From the age of seven every Spartan boy is raised by the state - hungry, hardened, obedient."
 LAK_spartiates:0 "The Equals"
 LAK_spartiates_desc:0 "Few, but each one worth many: the Spartiates in their scarlet cloaks."
 LAK_two_kings:0 "Two Kings"
 LAK_two_kings_desc:0 "The Agiad and the Eurypontid kings: one leads the army, one stays at home."
 LAK_ephors:0 "The Ephors"
 LAK_ephors_desc:0 "Five overseers, elected every year, watch over the kings themselves."
 LAK_helots:0 "The Helots"
 LAK_helots_desc:0 "The serfs of Laconia and Messenia till the land so that the Spartiates need do nothing but train."
 LAK_krypteia:0 "The Krypteia"
 LAK_krypteia_desc:0 "Every autumn the ephors declare war on the helots, and the young men hunt the bravest of them."
 LAK_war_with_argos:0 "War with Argos"
 LAK_war_with_argos_desc:0 "494 BC: at Sepeia Cleomenes destroys the army of Argos, the old rival."
 LAK_peloponnesian_league:0 "The Peloponnesian League"
 LAK_peloponnesian_league_desc:0 "Corinth, Arkadia, Elis and the Achaeans swear to have the same friends and enemies as Sparta."
 LAK_messenia:0 "Hold Messenia"
 LAK_messenia_desc:0 "The fertile land beyond Taygetus is Sparta's - and must be held by force."
 LAK_thermopylae:0 "Molon Labe"
 LAK_thermopylae_desc:0 "Come and take them. A Spartan does not surrender."
 LAK_against_athens:0 "Against Athens"
 LAK_against_athens_desc:0 "The walls of Athens grow, and so does its fleet. Sparta cannot allow a second hegemon."
 LAK_hegemon_of_hellas:0 "Hegemon of Hellas"
 LAK_hegemon_of_hellas_desc:0 "All Greece looks to Sparta to lead it in war."
 MKD_argead_house:0 "The Argead House"
 MKD_argead_house_desc:0 "Descendants of Herakles, say the kings of Aigai, and Greeks - whatever the southerners say."
 MKD_earth_and_water:0 "Earth and Water"
 MKD_earth_and_water_desc:0 "Amyntas gives earth and water to the envoys of Darius: Macedon bends, and survives."
 MKD_philhellene:0 "Alexander the Philhellene"
 MKD_philhellene_desc:0 "A Macedonian king runs at Olympia: the court opens to Greek poets and craftsmen."
 MKD_hetairoi:0 "The Companions"
 MKD_hetairoi_desc:0 "The nobles of Macedon ride beside their king - the finest heavy horse of the Greek world."
 MKD_upper_macedonia:0 "Upper Macedonia"
 MKD_upper_macedonia_desc:0 "The highland cantons and Paeonia must answer to Aigai."
 MKD_timber_and_silver:0 "Timber and Silver"
 MKD_timber_and_silver_desc:0 "Ship timber for the fleets of the south and silver from the Thracian hills."
 MKD_mines_of_pangaion:0 "Mines of Mount Pangaion"
 MKD_mines_of_pangaion_desc:0 "A thousand talents a year from the gold of Pangaion."
 MKD_pezhetairoi:0 "The Foot Companions"
 MKD_pezhetairoi_desc:0 "Shepherds become soldiers, honoured like the nobles."
 MKD_chalkidike:0 "The Chalkidike"
 MKD_chalkidike_desc:0 "The Greek cities of the three peninsulas block the sea. They must be ours."
 MKD_sarissa:0 "The Sarissa"
 MKD_sarissa_desc:0 "Pikes of eighteen feet, sixteen ranks deep: a hedge of iron."
 MKD_thessalian_alliance:0 "Archon of Thessaly"
 MKD_thessalian_alliance_desc:0 "The horse lords of Thessaly choose the king of Macedon as their leader."
 MKD_hammer_and_anvil:0 "Hammer and Anvil"
 MKD_hammer_and_anvil_desc:0 "The phalanx holds the enemy, the Companions break him."
 MKD_hegemon_of_the_greeks:0 "Hegemon of the Greeks"
 MKD_hegemon_of_the_greeks_desc:0 "Athens and Thebes must learn who leads Greece now."
 PRS_king_of_kings:0 "King of Kings"
 PRS_king_of_kings_desc:0 "Darius has crushed the rebel kings. From the Indus to the Aegean, one king rules."
 PRS_satrapies:0 "The Satrapies"
 PRS_satrapies_desc:0 "Twenty provinces, each with a satrap, a fixed tribute - and the King's Eyes and Ears watching."
 PRS_royal_road:0 "The Royal Road"
 PRS_royal_road_desc:0 "From Sardis to Susa in seven days: neither snow nor rain stays the royal couriers."
 PRS_immortals:0 "The Immortals"
 PRS_immortals_desc:0 "Ten thousand picked spearmen; when one falls, another takes his place."
 PRS_daric:0 "The Daric"
 PRS_daric_desc:0 "Gold coins with the archer king: the money of an empire."
 PRS_persepolis:0 "Persepolis"
 PRS_persepolis_desc:0 "A new royal city on a terrace in the mountains of Persis."
 PRS_qanats:0 "The Qanats"
 PRS_qanats_desc:0 "Underground channels carry the water of the mountains to the fields of the plateau."
 PRS_phoenician_fleet:0 "The Phoenician Fleet"
 PRS_phoenician_fleet_desc:0 "Sidon, Tyre and Arwad sail for the Great King."
 PRS_behistun:0 "The Inscription of Behistun"
 PRS_behistun_desc:0 "On the cliff, in three languages: what Darius did, by the favour of Ahura Mazda."
 PRS_nile_canal:0 "The Canal of the Nile"
 PRS_nile_canal_desc:0 "Ships sail from the Nile to the Red Sea, as Darius ordered."
 PRS_ionia:0 "Ionia Pacified"
 PRS_ionia_desc:0 "The Ionian cities rose; they will learn obedience - and keep their own laws, under satraps."
 PRS_scythian_campaign:0 "Beyond the Ister"
 PRS_scythian_campaign_desc:0 "The Scythians withdrew before the King's army once. Next time they will not escape."
 PRS_earth_and_water:0 "Earth and Water"
 PRS_earth_and_water_desc:0 "Envoys go to every Greek city: give earth and water, or face the King."
 PRS_king_of_the_world:0 "King of the Lands"
 PRS_king_of_the_world_desc:0 "Darius, the Great King, King of Kings, King of the lands of all peoples."
 CAR_magonid_dynasty:0 "The House of Mago"
 CAR_magonid_dynasty_desc:0 "Mago and his sons have made Carthage a power by land and sea."
 CAR_suffetes:0 "Suffetes and Council"
 CAR_suffetes_desc:0 "Two judges elected each year, a council of elders, and the court of the Hundred and Four."
 CAR_cothon:0 "The Cothon"
 CAR_cothon_desc:0 "A harbour within the walls, where the war fleet lies hidden from every eye."
 CAR_libyan_levies:0 "Libyan Levies"
 CAR_libyan_levies_desc:0 "The Libyan farmers of the hinterland owe tribute - and soldiers."
 CAR_treaty_with_rome:0 "Treaty with Rome"
 CAR_treaty_with_rome_desc:0 "509 BC: Rome and Carthage swear friendship. Romans keep away from Africa, Carthaginians from Latium."
 CAR_merchant_princes:0 "Merchant Princes"
 CAR_merchant_princes_desc:0 "Purple, silver, tin and wine: the trade of the western sea passes through Carthage."
 CAR_war_fleet:0 "The War Fleet"
 CAR_war_fleet_desc:0 "Quinqueremes and triremes enough to close the straits to every rival."
 CAR_mercenaries:0 "Mercenary Armies"
 CAR_mercenaries_desc:0 "Iberians, Gauls, Balearic slingers: silver buys the best soldiers of the West."
 CAR_sardinia:0 "Sardinia"
 CAR_sardinia_desc:0 "Malchus failed in Sardinia; the sons of Mago will not."
 CAR_sicily:0 "The Sicilian War"
 CAR_sicily_desc:0 "The Greeks of Sicily push against the Punic west of the island. Drive them back."
 CAR_masters_of_libya:0 "Masters of Libya"
 CAR_masters_of_libya_desc:0 "No more tribute to the Libyans for the land of the city: the hinterland becomes Carthage's."
 CAR_periplus_of_hanno:0 "The Voyage of Hanno"
 CAR_periplus_of_hanno_desc:0 "Sixty ships sail through the Pillars of Herakles and down the coast of Libya, to found cities and explore."
 CAR_iberia:0 "The Silver of Iberia"
 CAR_iberia_desc:0 "Tartessos falls silent; the mines of the south belong to the Phoenicians of Gadir - and Carthage."
 CAR_sacred_band:0 "The Sacred Band"
 CAR_sacred_band_desc:0 "Two and a half thousand citizens of the best families: the heart of the army."
 CAR_queen_of_the_sea:0 "Queen of the Western Sea"
 CAR_queen_of_the_sea_desc:0 "From the Pillars of Herakles to Sicily, no ship sails without the leave of Carthage."
