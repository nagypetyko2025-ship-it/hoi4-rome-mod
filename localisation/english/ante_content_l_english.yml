l_english:
 ante_council_of_elders:0 "Council of the Elders"
 ante_council_of_elders_desc:0 "The heads of the great families meet to decide the course of our people."
 ante_codify_customs:0 "Codify the Customs"
 ante_codify_customs_desc:0 "Write down - or recite before all - the laws of our fathers."
 ante_honour_the_gods:0 "Honour the Gods"
 ante_honour_the_gods_desc:0 "Raise altars and keep the festivals, so that the gods stand with us."
 ante_tribute:0 "Collect the Tribute"
 ante_tribute_desc:0 "Dues in grain, cattle and silver flow to the hall of the rulers."
 ante_envoys:0 "Envoys and Guest-Friends"
 ante_envoys_desc:0 "Gifts and oaths bind the great houses of our neighbours to ours."
 ante_oracles:0 "Consult the Oracles"
 ante_oracles_desc:0 "Seers, priests and wise men read the will of the gods - and much else."
 ante_scribes:0 "Scribes and Teachers"
 ante_scribes_desc:0 "Letters borrowed from the traders of the sea record our accounts and our deeds."
 ante_festivals:0 "Games and Festivals"
 ante_festivals_desc:0 "Contests of strength and song draw every clan to the sanctuary."
 ante_one_people:0 "One People"
 ante_one_people_desc:0 "Many clans, one assembly, one name."
 ante_tame_the_land:0 "Tame the Land"
 ante_tame_the_land_desc:0 "Drain the marshes, clear the scrub and mark the fields."
 ante_markets:0 "Markets and Trade"
 ante_markets_desc:0 "A market place under the protection of the gods brings traders from afar."
 ante_clear_forests:0 "Clear the Forests"
 ante_clear_forests_desc:0 "Axe and fire open new land for the plough."
 ante_craftsmen:0 "Craftsmen's Quarter"
 ante_craftsmen_desc:0 "Potters, weavers and carpenters settle by the walls."
 ante_mines:0 "Mines of the Hills"
 ante_mines_desc:0 "Copper, tin and the new iron are dug from the hills."
 ante_roads:0 "Paths and Fords"
 ante_roads_desc:0 "Tracks between the settlements, fords and ferries over the rivers."
 ante_smithies:0 "Smithies"
 ante_smithies_desc:0 "The smiths' fires burn day and night: spearheads, helmets, shields."
 ante_great_works:0 "Great Works"
 ante_great_works_desc:0 "Walls, temples and harbours that will outlast their builders."
 ante_city_of_stone:0 "A City of Stone"
 ante_city_of_stone_desc:0 "Our capital grows into a true city."
 ante_warrior_levy:0 "Levy of the Warriors"
 ante_warrior_levy_desc:0 "Every free man owes his spear when the horn sounds."
 ante_drill:0 "Drill the Spearmen"
 ante_drill_desc:0 "Shoulder to shoulder: the close order of the phalanx."
 ante_bronze_and_iron:0 "Bronze and Iron"
 ante_bronze_and_iron_desc:0 "Better blades and armour from the smiths."
 ante_horsemen:0 "Mounted Nobles"
 ante_horsemen_desc:0 "The sons of the great houses ride to war."
 ante_hillforts:0 "Hillforts"
 ante_hillforts_desc:0 "Earth ramparts and timber walls on every height."
 ante_seafarers:0 "Seafarers"
 ante_seafarers_desc:0 "Ships for fishing, trade - and raids along the coast."
 ante_war_bands:0 "Sworn War Bands"
 ante_war_bands_desc:0 "Companions who live and die with their lord."
 ante_ambition:0 "Ambition of Conquest"
 ante_ambition_desc:0 "Our neighbours' fields are rich and their walls are low."
 ante_host_of_the_people:0 "Host of the People"
 ante_host_of_the_people_desc:0 "The whole people under arms: a power to be feared."
 ante_rise_to_greatness:0 "Rise to Greatness"
 ante_rise_to_greatness_desc:0 "Lawgivers, builders and warriors have made us great. The world will know our name."
 ROM_regifugium:0 "Regifugium"
 ROM_regifugium_desc:0 "Tarquinius Superbus and his house are driven from the city. Rome will never again have a king."
 ROM_consuls_and_senate:0 "Consuls and Senate"
 ROM_consuls_and_senate_desc:0 "Two magistrates for one year, the fathers of the Senate to advise them."
 ROM_secession_of_the_plebs:0 "Secession of the Plebs"
 ROM_secession_of_the_plebs_desc:0 "The plebeians march out to the Sacred Mount: without them there is no army."
 ROM_tribunes_of_the_plebs:0 "Tribunes of the Plebs"
 ROM_tribunes_of_the_plebs_desc:0 "Sacrosanct protectors of the common people."
 ROM_capitoline_temple:0 "Temple of Jupiter on the Capitol"
 ROM_capitoline_temple_desc:0 "The great temple vowed by the kings is dedicated in the first year of the Republic."
 ROM_sibylline_books:0 "The Sibylline Books"
 ROM_sibylline_books_desc:0 "The prophetic books, kept by the priests, are consulted in every crisis."
 ROM_servian_centuries:0 "Classes and Centuries"
 ROM_servian_centuries_desc:0 "Every citizen serves according to his property: the hoplite phalanx of Rome."
 ROM_horatius_at_the_bridge:0 "Horatius at the Bridge"
 ROM_horatius_at_the_bridge_desc:0 "Lars Porsenna marches on Rome; one man holds the Sublician bridge."
 ROM_lake_regillus:0 "Battle of Lake Regillus"
 ROM_lake_regillus_desc:0 "The Latins and the exiled Tarquins are beaten; the Dioscuri fought for Rome."
 ROM_foedus_cassianum:0 "Foedus Cassianum"
 ROM_foedus_cassianum_desc:0 "Peace and alliance with the Latins: one army against the hill peoples."
 ROM_aequi_and_volsci:0 "Against the Aequi and Volsci"
 ROM_aequi_and_volsci_desc:0 "Every summer the hill tribes raid Latium. Every summer Rome marches."
 ante_favour_of_the_gods:0 "Favour of the Gods"
 ante_tribute_collectors:0 "Tribute Collectors"
 ante_granaries:0 "Granaries"
 ante_working_mines:0 "Working the Mines"
 ante_mounted_nobles:0 "Mounted Nobles"
 ante_hillforts_spirit:0 "Hillforts"
 ante_war_bands_spirit:0 "War Bands"
 ante_ambition_of_conquest:0 "Ambition of Conquest"
 ante_one_people_spirit:0 "One People"
 ante_culture_roman:0 "Roman Virtus: We Never Give Up!"
 ante_culture_latin:0 "Latin Culture"
 ante_culture_greek:0 "Hellenic Culture"
 ante_culture_etruscan:0 "Etruscan Culture"
 ante_culture_punic:0 "Phoenician Heritage"
 ante_culture_persian:0 "Achaemenid Order"
 ante_culture_anatolian:0 "Anatolian Culture"
 ante_culture_nilotic:0 "Kushite Tradition"
 ante_culture_italic:0 "Italic Hill Peoples"
 ante_culture_iapygian:0 "Iapygian Culture"
 ante_culture_celtic:0 "Celtic Warrior Society"
 ante_culture_germanic:0 "Germanic Tribes"
 ante_culture_northern:0 "Peoples of the Far North"
 ante_culture_iberian:0 "Iberian Warrior Bands"
 ante_culture_thracian:0 "Thracian Tribes"
 ante_culture_scythian:0 "Steppe Nomads"
 ante_culture_libyan:0 "Desert Tribes"
 ante_culture_arabian:0 "Caravan Peoples of Arabia"
 ante_culture_caucasian:0 "Mountain Clans of the Caucasus"
 ante_culture_island:0 "Nuragic Tradition"
 ante_culture_roman_desc:0 "Kings have been driven out, but the Roman people remain. Rome has lost battles and will lose more; it has never accepted defeat. Its enemies must take far more of its land before the city will even think of surrender."
 ante_culture_latin_desc:0 "The Latin towns share one tongue, one festival on the Alban Mount and the rights of marriage and trade."
 ante_culture_greek_desc:0 "Poets, philosophers and the citizen in bronze armour: the polis is the measure of all things."
 ante_culture_etruscan_desc:0 "Rich in metals, temples and painted tombs; the twelve cities trade with the whole sea."
 ante_culture_punic_desc:0 "Merchants and seafarers from Tyre: the sea is their road and silver their weapon."
 ante_culture_persian_desc:0 "Satraps, roads and royal law hold together peoples from the Aegean to the Indus."
 ante_culture_anatolian_desc:0 "Heirs of Phrygia and Lydia, old kingdoms of gold, horses and cities."
 ante_culture_nilotic_desc:0 "The land of the bow: pharaonic temples at Napata and archers famed since the Old Kingdom."
 ante_culture_italic_desc:0 "Shepherds and warriors of the Apennines, quick to raid the plains below."
 ante_culture_iapygian_desc:0 "Messapians, Peucetians and Daunians: half in the world of the Greeks, half in their own."
 ante_culture_celtic_desc:0 "Feasts, feuds and the furious charge: glory is won in battle, and the druids keep the lore unwritten."
 ante_culture_germanic_desc:0 "Forest peoples of the North: the assembly of armed men decides war and peace."
 ante_culture_northern_desc:0 "Hunters, fishers and farmers of the long winters, far from the cities of the South."
 ante_culture_iberian_desc:0 "Light, swift and sworn to their chiefs unto death; masters of the ambush in broken country."
 ante_culture_thracian_desc:0 "The most numerous people after the Indians, says Herodotus - and unconquerable, if only they were united."
 ante_culture_scythian_desc:0 "Their homes are wagons and their wealth is herds: an enemy finds no town to take and no army to catch."
 ante_culture_libyan_desc:0 "Herdsmen and raiders who know every well between the sea and the Sahara."
 ante_culture_arabian_desc:0 "Incense, camels and the desert roads: rich from trade, untouchable in the sands."
 ante_culture_caucasian_desc:0 "Every valley its own lord, every pass a fortress."
 ante_culture_island_desc:0 "The tower-builders of Sardinia, bronze-casters and warriors of the hills."
 ante_liberator:0 "Liberator of the City"
 ante_merchant_prince:0 "Merchant Prince"
 ante_king_of_kings:0 "King of Kings"
 ante_lawgiver:0 "Lawgiver"
 ante_spartan_king:0 "King of the Spartans"
 ante_lucumo:0 "Lucumo"
 ante_war_leader:0 "War Leader"
 ante_shrewd_vassal:0 "Shrewd Vassal"
 ante_horse_lord:0 "Lord of Horsemen"
 ante_tribal_chief:0 "Chief of the Clans"
 ante_scribes_bonus:0 "Scribes and Teachers"
 ante_mines_bonus:0 "Mines of the Hills"
 ante_great_works_bonus:0 "Great Works"
 ante_weapons_bonus:0 "Bronze and Iron"
 ante_drill_bonus:0 "Drill the Spearmen"
 ROM_brutus:0 "Lucius Junius Brutus"
 ROM_brutus_desc:0 "Drove out Tarquinius Superbus, the last king, and became one of the first two consuls of the Republic."
 CAR_hamilcar:0 "Hamilcar"
 CAR_hamilcar_desc:0 "Of the house of Mago, which leads Carthage and its fleets in the late sixth century BC."
 PRS_darius:0 "Darius I"
 PRS_darius_desc:0 "Dārayavauš, King of Kings since 522 BC, who organised the empire into satrapies and built the Royal Road."
 ATH_cleisthenes:0 "Cleisthenes"
 ATH_cleisthenes_desc:0 "The Alcmaeonid who, after the fall of the tyrants, reorganised the Athenians into ten tribes."
 LAK_cleomenes:0 "Cleomenes I"
 LAK_cleomenes_desc:0 "Agiad king of Sparta, who helped to expel the Peisistratids from Athens in 510 BC."
 CLU_porsenna:0 "Lars Porsenna"
 CLU_porsenna_desc:0 "King of Clusium, who according to the Romans marched on Rome to restore the Tarquins."
 LAT_mamilius:0 "Octavius Mamilius"
 LAT_mamilius_desc:0 "Lord of Tusculum and son-in-law of Tarquinius Superbus, leader of the Latins against Rome."
 MKD_amyntas:0 "Amyntas I"
 MKD_amyntas_desc:0 "Argead king of Macedon, who gave earth and water to the envoys of Darius."
 SCY_idanthyrsus:0 "Idanthyrsus"
 SCY_idanthyrsus_desc:0 "King of the Royal Scythians, who drew Darius' army deep into the steppe and wore it down."
 KSH_amaniastabarqo:0 "Amaniastabarqo"
 KSH_amaniastabarqo_desc:0 "King of Kush at Napata, heir of the pharaohs of the Twenty-fifth Dynasty."
 KYR_battus:0 "Battus IV"
 KYR_battus_desc:0 "Battiad king of Cyrene, ruling under the shadow of Persian Egypt."
 SAK_skunkha:0 "Skunkha"
 SAK_skunkha_desc:0 "Chief of the pointed-hat Saka, defeated by Darius and shown on the Behistun relief."
 AGA_spargapeithes:0 "Spargapeithes"
 AGA_spargapeithes_desc:0 "King of the Agathyrsi, named by Herodotus."
 KRO_milo:0 "Milo"
 KRO_milo_desc:0 "Milo of Croton, six times Olympic victor, who led the army that destroyed Sybaris in 510 BC."
 ODR_teres:0 "Teres"
 ODR_teres_desc:0 "Founder of the power of the Odrysian Thracians."
 MSG_tomyris:0 "Tomyris"
 MSG_tomyris_desc:0 "Queen of the Massagetae, remembered for the defeat of Cyrus the Great."
 SAU_aspakos:0 "Aspakos"
 SAU_aspakos_desc:0 "Chief of the Sauromatae. (Invented: their rulers of this age are not known by name.)"
 NEU_vaidevutis:0 "Vaidevutis"
 NEU_vaidevutis_desc:0 "Elder of the Neuri. (Invented, after a figure of Baltic legend.)"
 FEN_kaleva:0 "Kaleva"
 FEN_kaleva_desc:0 "Elder of the Fenni. (Invented, after a figure of Finnic legend.)"
 SIG_artaios:0 "Artaios"
 SIG_artaios_desc:0 "Chief of the Sigynnae, who dress like Medes. (Invented name.)"
 GTA_zalmodegikos:0 "Zalmodegikos"
 GTA_zalmodegikos_desc:0 "King of the Getae. (Invented name in the Thracian manner.)"
 PAN_pinnes:0 "Pinnes"
 PAN_pinnes_desc:0 "Chief of the Pannonii. (Invented name in the Illyrian manner.)"
 BUD_taxakis:0 "Taxakis"
 BUD_taxakis_desc:0 "Chief of the Budini. (Invented name.)"
 AES_gintaras:0 "Gintaras"
 AES_gintaras_desc:0 "Elder of the Aestii, the amber gatherers. (Invented name.)"
 GAE_iarbas:0 "Iarbas"
 GAE_iarbas_desc:0 "Chief of the Gaetuli. (Invented, after the Libyan king of the Dido legend.)"
 LUG_vannius:0 "Vannius"
 LUG_vannius_desc:0 "Chief of the Lugii. (Invented name.)"
 THY_arpoxais:0 "Arpoxais"
 THY_arpoxais_desc:0 "Chief of the Thyssagetae. (Invented, after a son of Targitaus in the Scythian origin legend.)"
 ISS_kolaxais:0 "Kolaxais"
 ISS_kolaxais_desc:0 "Chief of the Issedones. (Invented, after a figure of the Scythian origin legend.)"
