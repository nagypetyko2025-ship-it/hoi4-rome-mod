l_english:
 ante_victory.1.t:0 "Victory! Italy Is Rome's"
 ante_victory.1.d:0 "We have taken Italy, we have taken the Po, we have taken Sicily! Everything that matters is ours! From here we can go further and unite the whole world! We have won - we are the strongest!"
 ante_victory.1.a:0 "We won!"
 ante_victory.1.b:0 "We continue!"
 ante_victory.2.t:0 "Victory! Mistress of the Western Sea"
 ante_victory.2.d:0 "Africa is ours, the south of Hispania has fallen, and now we bring wealth and prosperity to everyone. Long live Carthage, long live the leader!"
 ante_victory.2.a:0 "We won!"
 ante_victory.2.b:0 "We continue!"
 ante_victory.3.t:0 "Victory! King of the Four Corners of the World"
 ante_victory.3.d:0 "The Greeks have bowed before us. We are the greatest power in the world: the wealth and prosperity we have created make us the centre of civilisation! And we held the empire together - we did not fall apart!"
 ante_victory.3.a:0 "We won!"
 ante_victory.3.b:0 "We continue!"
 ante_victory.10.t:0 "The Gods Favour You"
 ante_victory.10.a:0 "So be it."
 ante_victory.10.d:0 "[Root.GetName] receives every land its goal needs (cheat: Rome - Italy, Sicily and the Po valley; Carthage - the Punic lands; Persia - everything its focus tree can win, Egypt and Babylon). Countries without a goal get nothing."
 ANTE_TT_CHEAT_ROM:0 "Rome receives all of Italy, Sicily and the Po valley. The victory screen follows within a week."
 ANTE_TT_CHEAT_CAR:0 "Carthage receives the Punic lands. Take the decision 'The Punic Empire' for the victory."
 ANTE_TT_CHEAT_PRS:0 "Persia receives Hellas, Phoenicia, the steppe, Kush, the Marmaridae, Cyrene, Egypt and Babylon. Take the decision 'King of the Four Corners of the World' for the victory."
 ANTE_TT_CHEAT_NONE:0 "This country has no goal: nothing happens."
