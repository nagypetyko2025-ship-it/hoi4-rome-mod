l_english:
 industrial_complex:0 "Workshops"
 industrial_complex_plural:0 "Workshops"
 industrial_complex_desc:0 "Potters, weavers, carpenters, masons and traders: the work of a town. They produce the goods people need and build everything else - walls, roads, harbours, temples."
 arms_factory:0 "Armoury"
 arms_factory_plural:0 "Armouries"
 arms_factory_desc:0 "Smiths and armourers forge spearheads, swords, helmets and shields, and make bows and wagons for the army."
 dockyard:0 "Shipyard"
 dockyard_plural:0 "Shipyards"
 dockyard_desc:0 "Slipways, timber stores and shipwrights: here penteconters and triremes are built."
 naval_base:0 "Harbour"
 naval_base_plural:0 "Harbours"
 naval_base_desc:0 "Moles, quays and ship sheds. The fleet rests, refits and takes on water here; goods and soldiers sail from here overseas. The larger the harbour, the more ships it can serve."
 infrastructure:0 "Roads"
 infrastructure_plural:0 "Roads"
 infrastructure_desc:0 "Tracks, causeways, bridges and fords. Better roads carry more grain and move armies faster."
 bunker:0 "Fortifications"
 bunker_plural:0 "Fortifications"
 bunker_desc:0 "Ramparts, ditches and walls: every level makes an attacker pay $VALUE|+%0$ more in battle."
 coastal_bunker:0 "Sea Walls"
 coastal_bunker_plural:0 "Sea Walls"
 coastal_bunker_desc:0 "Walls and towers along the shore: every level makes an enemy landing pay $VALUE|+%0$ more."
