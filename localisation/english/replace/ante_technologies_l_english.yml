l_english:
 ante_bronze_weapons:0 "Bronze Weapons"
 ante_bronze_weapons_desc:0 "Cast bronze spearheads, daggers and axes: the arms of the age of heroes."
 ante_iron_weapons:0 "Iron Weapons"
 ante_iron_weapons_desc:0 "Iron is harder to work but everywhere to be found: every man can now carry a good blade."
 ante_forged_steel:0 "Forged Steel"
 ante_forged_steel_desc:0 "Hammered, folded and quenched: the swords of Noricum and Iberia."
 ante_short_sword:0 "The Short Sword"
 ante_short_sword_desc:0 "A short, stabbing sword for the press of battle - the Iberian blade that Rome will make its own."
 ante_bronze_armour:0 "Bronze Armour"
 ante_bronze_armour_desc:0 "Helmet, cuirass and greaves beaten from bronze sheet."
 ante_linothorax:0 "Linothorax"
 ante_linothorax_desc:0 "Layers of glued linen: lighter than bronze, almost as strong."
 ante_chain_mail:0 "Mail and the Long Shield"
 ante_chain_mail_desc:0 "Rings of iron, invented by the Celts, and the curved oval shield."
 ante_simple_bows:0 "Bows and Slings"
 ante_simple_bows_desc:0 "The hunter's bow and the shepherd's sling go to war."
 ante_composite_bows:0 "Composite Bows"
 ante_composite_bows_desc:0 "Horn, wood and sinew: the bow of the steppe shoots twice as far."
 ante_lead_shot:0 "Lead Sling Shot"
 ante_lead_shot_desc:0 "Cast lead bullets, some inscribed with insults for the enemy."
 ante_close_order:0 "Close Order"
 ante_close_order_desc:0 "Shield overlapping shield: the phalanx moves as one body."
 ante_open_order:0 "Open Order"
 ante_open_order_desc:0 "Javelin men and peltasts who strike and withdraw before the heavy foot can close."
 ante_maniples:0 "Maniples"
 ante_maniples_desc:0 "Small, flexible units in three lines that relieve each other in battle."
 ante_pack_animals:0 "Pack Animals and Carts"
 ante_pack_animals_desc:0 "Mules, donkeys and ox-carts carry the grain behind the army."
 ante_supply_wagons:0 "Supply Trains"
 ante_supply_wagons_desc:0 "Organised columns of wagons and depots along the line of march."
 ante_military_roads:0 "Military Roads"
 ante_military_roads_desc:0 "Straight, paved, drained: the army marches a day's journey further."
 ante_scouting:0 "Scouts and Outriders"
 ante_scouting_desc:0 "Light horsemen ahead of the column find the enemy before he finds us."
 ante_spies:0 "Spies and Informers"
 ante_spies_desc:0 "Traders, deserters and bribed slaves tell what the enemy plans."
 ante_field_camps:0 "Fortified Camps"
 ante_field_camps_desc:0 "Every evening a ditch and a palisade: the army sleeps safe in enemy country."
 ante_army_surgeons:0 "Army Surgeons"
 ante_army_surgeons_desc:0 "Physicians in the camp: fewer men die of their wounds."
 ante_riding:0 "Horsemanship"
 ante_riding_desc:0 "Riding to war, not only to the battlefield."
 ante_horse_breeding:0 "Horse Breeding"
 ante_horse_breeding_desc:0 "Stud farms of Thessaly and Media breed taller, stronger horses."
 ante_horned_saddle:0 "The Horned Saddle"
 ante_horned_saddle_desc:0 "A saddle with four horns holds the rider firm in the charge."
 ante_chariotry:0 "Chariotry"
 ante_chariotry_desc:0 "The old war car of kings and heroes."
 ante_scythed_chariots:0 "Scythed Chariots"
 ante_scythed_chariots_desc:0 "Blades on the axles: a terror for infantry in open order."
 ante_horse_archery:0 "Horse Archery"
 ante_horse_archery_desc:0 "Shooting at the gallop, even backwards: the art of the steppe."
 ante_heavy_cavalry:0 "Heavy Cavalry"
 ante_heavy_cavalry_desc:0 "Armoured riders with the long lance: the Companions of Macedon."
 ante_war_elephants_tech:0 "War Elephants"
 ante_war_elephants_tech_desc:0 "Indian elephants, their drivers and towers: the beasts that terrified the West."
 ante_rams_and_ladders:0 "Rams and Ladders"
 ante_rams_and_ladders_desc:0 "The oldest way into a city: break the gate or climb the wall."
 ante_siege_towers:0 "Siege Towers"
 ante_siege_towers_desc:0 "Moving towers taller than the walls, covered in wet hides."
 ante_torsion_engines:0 "Torsion Engines"
 ante_torsion_engines_desc:0 "Twisted sinew throws stones and bolts: the catapult of Dionysius of Syracuse."
 ante_field_artillery:0 "Field Engines"
 ante_field_artillery_desc:0 "Bolt-throwers that move with the army and sweep the field."
 ante_earthworks:0 "Earthworks"
 ante_earthworks_desc:0 "Ramparts, ditches and stakes that hold an enemy at bay."
 ante_stone_walls:0 "Stone Walls"
 ante_stone_walls_desc:0 "Ashlar walls with towers around the whole city."
 ante_poliorcetics:0 "Poliorcetics"
 ante_poliorcetics_desc:0 "The science of sieges: mines, counter-mines, circumvallation."
 ante_seafaring:0 "Seafaring"
 ante_seafaring_desc:0 "Oared ships that carry warriors along the coasts and across the straits."
 ante_ramming:0 "The Bronze Ram"
 ante_ramming_desc:0 "Row hard, strike the enemy's side, back oars: the ship itself is the weapon."
 ante_diekplous:0 "Diekplous"
 ante_diekplous_desc:0 "Break through the enemy line, turn and ram from behind - the manoeuvre of the best crews."
 ante_quinquereme_tech:0 "The Quinquereme"
 ante_quinquereme_tech_desc:0 "Five rowers to each column of oars: heavier ships for marines and war engines."
 ante_ship_sheds:0 "Ship Sheds"
 ante_ship_sheds_desc:0 "Long sheds on the shore where ships are built and kept dry in winter."
 ante_marines:0 "Marines"
 ante_marines_desc:0 "Soldiers on deck who board the enemy and lead the landings."
 ante_lighthouses:0 "Lighthouses"
 ante_lighthouses_desc:0 "Fires on headlands and towers at harbour mouths: ships sail by night and far from home."
 ante_writing:0 "Writing"
 ante_writing_desc:0 "Letters borrowed from the Phoenicians: accounts, laws and treaties on stone, bronze and leather."
 ante_schools:0 "Schools"
 ante_schools_desc:0 "Teachers of letters and numbers for the sons of citizens."
 ante_philosophy:0 "Philosophy"
 ante_philosophy_desc:0 "Questions about nature, the gods and the good life, asked in public."
 ante_academy:0 "The Academy"
 ante_academy_desc:0 "A grove outside Athens where philosophers teach and argue for life."
 ante_museion:0 "The Museion"
 ante_museion_desc:0 "A royal house of the Muses with a library of all the books in the world."
 ante_mathematics:0 "Geometry"
 ante_mathematics_desc:0 "Measuring fields, angles and the heights of walls."
 ante_astronomy:0 "Astronomy"
 ante_astronomy_desc:0 "The stars and the calendar: sailors steer and farmers sow by them."
 ante_mechanics:0 "Mechanics"
 ante_mechanics_desc:0 "Levers, pulleys, screws and gears: the machines of Archimedes."
 ante_medicine:0 "Medicine"
 ante_medicine_desc:0 "Herbs, surgery and the temple of Asclepius."
 ante_hippocratic_medicine:0 "Hippocratic Medicine"
 ante_hippocratic_medicine_desc:0 "Disease has natural causes: observe, record, and do no harm."
 ante_rhetoric:0 "Rhetoric"
 ante_rhetoric_desc:0 "The art of persuading an assembly - or a jury."
 ante_written_law:0 "Written Law"
 ante_written_law_desc:0 "The law on public tablets binds the judges as well as the judged."
 ante_bronze_casting:0 "Bronze Casting"
 ante_bronze_casting_desc:0 "Copper and tin melted together and poured into moulds."
 ante_iron_smelting:0 "Iron Smelting"
 ante_iron_smelting_desc:0 "Bloomeries in every valley with ore and wood."
 ante_bellows_furnace:0 "Bellows and Shaft Furnace"
 ante_bellows_furnace_desc:0 "Hotter fires, more iron, better iron."
 ante_state_workshops:0 "State Workshops"
 ante_state_workshops_desc:0 "Arsenals and workshops owned by the state turn out arms by the thousand."
 ante_masonry:0 "Masonry"
 ante_masonry_desc:0 "Cut stone laid without mortar: walls, temples and terraces."
 ante_lime_mortar:0 "Lime Mortar"
 ante_lime_mortar_desc:0 "Burnt lime binds stone to stone: building is faster and higher."
 ante_opus_caementicium:0 "Opus Caementicium"
 ante_opus_caementicium_desc:0 "Volcanic ash, lime and rubble: a stone that is poured."
 ante_irrigation:0 "Irrigation"
 ante_irrigation_desc:0 "Canals, dams and water-lifting wheels make the dry land green."
 ante_heavy_plough:0 "The Iron Ploughshare"
 ante_heavy_plough_desc:0 "Iron shares turn the heavy soils of the river valleys."
 ante_mining:0 "Deep Mining"
 ante_mining_desc:0 "Shafts and galleries follow the vein deep into the mountain."
 ante_water_mills:0 "Water Mills"
 ante_water_mills_desc:0 "The river grinds the grain: hands are free for other work."
 ante_coinage:0 "Coinage"
 ante_coinage_desc:0 "Stamped metal of fixed weight: trade without weighing silver."
 infantry_folder:0 "Arms and Armour"
 infantry_folder_desc:0 "Weapons, armour and the drill of the foot soldiers."
 support_folder:0 "Auxiliaries and Supply"
 support_folder_desc:0 "Baggage, scouts, camps and surgeons."
 armour_folder:0 "Horse and Chariot"
 armour_folder_desc:0 "Horsemen, chariots and war elephants."
 artillery_folder:0 "Siege Craft"
 artillery_folder_desc:0 "Engines of war, walls and the art of taking cities."
 naval_folder:0 "Seafaring"
 naval_folder_desc:0 "Oared warships, harbours and landings."
 electronics_folder:0 "Learning"
 electronics_folder_desc:0 "Writing, philosophy, mathematics, astronomy and medicine."
 industry_folder:0 "Crafts and Building"
 industry_folder_desc:0 "Metalwork, building, farming and mining."
